[package]
name = "hprof-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for hprof-analyzer — powers the in-browser heap dump analysis tool."
license = "MIT"
repository = "https://github.com/parttimenerd/hprof-analyzer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hprof-analyzer = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
flate2 = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
