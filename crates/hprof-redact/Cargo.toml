[package]
name = "hprof-redact"
version = "0.3.0"
edition = "2024"
publish = false
description = "Standalone heap dump redactor (built by CI as a separate minimal binary)."
license = "MIT"
repository = "https://github.com/parttimenerd/hprof-analyzer"

[[bin]]
name = "hprof-redact"
path = "src/main.rs"

[dependencies]
hprof-analyzer = { path = "../..", default-features = false, features = ["redact-bin"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
