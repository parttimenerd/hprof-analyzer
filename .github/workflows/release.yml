name: Release

on:
  # Tagged releases: build + attach archives to a GitHub Release for the tag.
  # Main-branch pushes: replace the rolling `nightly` release.
  push:
    branches: [main]
    tags: ["v*"]
  # Manual trigger (always builds; publishes to the rolling `nightly` release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Always proceed — the workflow is only triggered by real events (push /
  # tag / manual), so there is no need to gate on recent-commit counts.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Proceed
        id: check
        run: echo "proceed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      # build.rs bundles web/ (esbuild) into the git-ignored web/dist/bundle.js
      # that src/html.rs embeds, so node/npm are required to compile the crate.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --features native --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          staging="hprof-analyzer-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/hprof-analyzer" "$staging/"
          cp LICENSE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          staging="hprof-analyzer-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/hprof-analyzer.exe" "$staging/"
          cp LICENSE README.md "$staging/"
          7z a "$staging.zip" "$staging"
          echo "ASSET=$staging.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Tagged release: publish archives to the Release for the pushed tag.
  release-tag:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # Tagged release: open a PR on the Homebrew tap with updated URLs + SHA256s.
  update-homebrew-tap:
    needs: release-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        run: |
          mac_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          linux_x86=$(sha256sum artifacts/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          linux_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          echo "mac_arm=$mac_arm"       >> "$GITHUB_OUTPUT"
          echo "linux_x86=$linux_x86"  >> "$GITHUB_OUTPUT"
          echo "linux_arm=$linux_arm"  >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: parttimenerd/homebrew-hprof-analyzer
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write formula and open PR
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.linux_arm }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/parttimenerd/hprof-analyzer/releases/download/${TAG}"
          BRANCH="release-${TAG}"

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          cat > Formula/hprof-analyzer.rb << 'ENDOFFORMULA'
class HprofAnalyzer < Formula
  desc "Fast, low-memory Java HPROF heap-dump analyzer with MCP server and OQL query engine"
  homepage "https://github.com/parttimenerd/hprof-analyzer"
  license "MIT"

  on_macos do
    on_arm do
      url "BASE_URL_PLACEHOLDER/hprof-analyzer-aarch64-apple-darwin.tar.gz"
      sha256 "SHA_MAC_ARM_PLACEHOLDER"
      version "VERSION_PLACEHOLDER"
    end
  end

  on_linux do
    on_intel do
      url "BASE_URL_PLACEHOLDER/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz"
      sha256 "SHA_LINUX_X86_PLACEHOLDER"
      version "VERSION_PLACEHOLDER"
    end
    on_arm do
      url "BASE_URL_PLACEHOLDER/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz"
      sha256 "SHA_LINUX_ARM_PLACEHOLDER"
      version "VERSION_PLACEHOLDER"
    end
  end

  def install
    bin.install "hprof-analyzer"
  end

  def caveats
    <<~EOS
      Add the MCP server to Claude Code:
        claude mcp add hprof -- hprof-analyzer mcp

      Or add to Claude Desktop (~/.claude/mcp.json):
        { "mcpServers": { "hprof": { "command": "hprof-analyzer", "args": ["mcp"] } } }

      See https://github.com/parttimenerd/hprof-analyzer#mcp-server--ai-integration
    EOS
  end

  test do
    system "#{bin}/hprof-analyzer", "--version"
    assert_match "SELECT", shell_output("#{bin}/hprof-analyzer heap docs --topic syntax")
  end
end
ENDOFFORMULA

          # Substitute placeholders (no heredoc variable expansion needed)
          sed -i "s|BASE_URL_PLACEHOLDER|${BASE_URL}|g" Formula/hprof-analyzer.rb
          sed -i "s|SHA_MAC_ARM_PLACEHOLDER|${SHA_MAC_ARM}|g" Formula/hprof-analyzer.rb
          sed -i "s|SHA_LINUX_X86_PLACEHOLDER|${SHA_LINUX_X86}|g" Formula/hprof-analyzer.rb
          sed -i "s|SHA_LINUX_ARM_PLACEHOLDER|${SHA_LINUX_ARM}|g" Formula/hprof-analyzer.rb
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" Formula/hprof-analyzer.rb

          git add Formula/hprof-analyzer.rb
          git commit -m "Update hprof-analyzer formula to ${TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --repo parttimenerd/homebrew-hprof-analyzer \
            --head "$BRANCH" \
            --base main \
            --title "Update hprof-analyzer to ${TAG}" \
            --body "Automated formula update for release ${TAG}."

  # Nightly push: also update the tap's nightly formula (separate file).
  update-homebrew-tap-nightly:
    needs: release-nightly
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        run: |
          mac_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          linux_x86=$(sha256sum artifacts/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          linux_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          echo "mac_arm=$mac_arm"       >> "$GITHUB_OUTPUT"
          echo "linux_x86=$linux_x86"  >> "$GITHUB_OUTPUT"
          echo "linux_arm=$linux_arm"  >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: parttimenerd/homebrew-hprof-analyzer
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write nightly formula and push
        env:
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.linux_arm }}
          COMMIT: ${{ github.sha }}
        run: |
          BASE_URL="https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly"

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > Formula/hprof-analyzer-nightly.rb << 'ENDOFFORMULA'
class HprofAnalyzerNightly < Formula
  desc "hprof-analyzer nightly — rolling build from main (MCP server + heap CLI)"
  homepage "https://github.com/parttimenerd/hprof-analyzer"
  license "MIT"
  version "nightly"

  on_macos do
    on_arm do
      url "BASE_URL_PLACEHOLDER/hprof-analyzer-aarch64-apple-darwin.tar.gz"
      sha256 "SHA_MAC_ARM_PLACEHOLDER"
    end
  end

  on_linux do
    on_intel do
      url "BASE_URL_PLACEHOLDER/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz"
      sha256 "SHA_LINUX_X86_PLACEHOLDER"
    end
    on_arm do
      url "BASE_URL_PLACEHOLDER/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz"
      sha256 "SHA_LINUX_ARM_PLACEHOLDER"
    end
  end

  def install
    bin.install "hprof-analyzer"
  end

  def caveats
    <<~EOS
      Add the MCP server to Claude Code:
        claude mcp add hprof -- hprof-analyzer mcp

      See https://github.com/parttimenerd/hprof-analyzer#mcp-server--ai-integration
    EOS
  end

  test do
    system "#{bin}/hprof-analyzer", "--version"
    assert_match "SELECT", shell_output("#{bin}/hprof-analyzer heap docs --topic syntax")
  end
end
ENDOFFORMULA

          sed -i "s|BASE_URL_PLACEHOLDER|${BASE_URL}|g" Formula/hprof-analyzer-nightly.rb
          sed -i "s|SHA_MAC_ARM_PLACEHOLDER|${SHA_MAC_ARM}|g" Formula/hprof-analyzer-nightly.rb
          sed -i "s|SHA_LINUX_X86_PLACEHOLDER|${SHA_LINUX_X86}|g" Formula/hprof-analyzer-nightly.rb
          sed -i "s|SHA_LINUX_ARM_PLACEHOLDER|${SHA_LINUX_ARM}|g" Formula/hprof-analyzer-nightly.rb

          # Also keep the stable formula pointing at nightly until a tagged release exists.
          # Once a tagged release is published, the update-homebrew-tap job takes over.
          if grep -q "releases/download/nightly" Formula/hprof-analyzer.rb; then
            sed -i "s|sha256 \"[0-9a-f]\{64\}\"\( *# mac_arm\)\?|sha256 \"REPLACE\"|g" Formula/hprof-analyzer.rb || true
            # Simpler: regenerate the stable formula from scratch with nightly URLs
            cp Formula/hprof-analyzer-nightly.rb /tmp/nightly_copy.rb
            sed 's/class HprofAnalyzerNightly/class HprofAnalyzer/' /tmp/nightly_copy.rb \
              | sed 's/hprof-analyzer nightly — rolling build from main (MCP server + heap CLI)/Fast, low-memory Java HPROF heap-dump analyzer with MCP server and OQL query engine/' \
              > Formula/hprof-analyzer.rb
          fi

          git add Formula/hprof-analyzer-nightly.rb Formula/hprof-analyzer.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update nightly formula (${COMMIT::8})"
          git push origin main

  # Main push / manual: replace the single rolling `nightly` pre-release.
  release-nightly:
    needs: build
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          echo "NIGHTLY_DATE=$(date -u '+%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Publish rolling nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ env.NIGHTLY_DATE }})"
          prerelease: true
          files: artifacts/*
          body: |
            Rolling nightly build — updated on every push to `main`.
            Commit: ${{ github.sha }}

            ## Install / Update

            **Already installed?** Just run:
            ```sh
            hprof-analyzer update nightly
            ```

            **First install** — pick your platform below, then use `hprof-analyzer update nightly` to stay current.

            **Linux x86_64 (glibc)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv hprof-analyzer-x86_64-unknown-linux-gnu/hprof-analyzer /usr/local/bin/
            ```

            **Linux x86_64 (static musl — minimal containers, older distros)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-unknown-linux-musl.tar.gz | tar xz
            sudo mv hprof-analyzer-x86_64-unknown-linux-musl/hprof-analyzer /usr/local/bin/
            ```

            **Linux aarch64 (glibc)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv hprof-analyzer-aarch64-unknown-linux-gnu/hprof-analyzer /usr/local/bin/
            ```

            **macOS (Apple Silicon)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv hprof-analyzer-aarch64-apple-darwin/hprof-analyzer /usr/local/bin/
            ```

            **Windows x86_64** — download [`hprof-analyzer-x86_64-pc-windows-msvc.zip`](https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-pc-windows-msvc.zip) and place `hprof-analyzer.exe` on your `PATH`.
