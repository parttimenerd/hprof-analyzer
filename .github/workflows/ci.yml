name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint + full test suite (unit + integration + parity). Ubuntu only: the tests
  # are platform-independent and the parity fixtures are the same everywhere.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      # build.rs bundles web/ (esbuild) into the git-ignored web/dist/bundle.js
      # that src/html.rs embeds, so node/npm are required to compile the crate.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --release --all-targets --features native -- -D warnings

      - name: Build
        run: cargo build --release --features native

      - name: Test (unit + integration + parity)
        run: cargo test --release --features native

      - name: Smoke test — heap docs (no dump required)
        run: |
          ./target/release/hprof-analyzer heap docs --topic syntax | grep -q "SELECT"
          ./target/release/hprof-analyzer heap docs --topic examples | grep -q "GROUP BY"

      - name: Smoke test — MCP tools/list
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized","params":{}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 10 ./target/release/hprof-analyzer mcp \
            | grep -q '"get_session_info"'

      - name: Upload binary artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: hprof-analyzer-linux
          path: target/release/hprof-analyzer
          retention-days: 1

  # Deploy GitHub Pages only on main push, after build-test passes.
  # Re-uses the binary artifact from build-test to avoid a second full Rust build.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly + rust-src (for wasm64)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Rust toolchain (stable, default)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Download AFTER cache restore — rust-cache restores target/ and would
      # overwrite the artifact if this step came first.
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: hprof-analyzer-linux
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/hprof-analyzer

      - name: Generate sample reports
        run: BIN=$(pwd)/target/release/hprof-analyzer ./scripts/gen-samples.sh

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-bindgen-cli (for wasm64 build)
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build browser REPL
        run: bash scripts/build-browser.sh

      - name: Build browser REPL (wasm64 experimental)
        run: bash scripts/build-browser-wasm64.sh

      - name: Install browser REPL as homepage
        run: cp dist/hprof-analyzer-browser.html docs/index.html

      - name: Install wasm64 assets
        run: |
          mkdir -p docs/wasm64
          cp dist/wasm64/hprof_wasm.js        docs/wasm64/hprof_wasm.js
          cp dist/wasm64/hprof_wasm_bg.wasm   docs/wasm64/hprof_wasm_bg.wasm

      - name: Copy sample hprof fixtures
        run: |
          cp tests/fixtures/dump_1_mnemonics.hprof    docs/samples/dump_1_mnemonics.hprof
          cp tests/fixtures/dump_2_scala-doku.hprof   docs/samples/dump_2_scala-doku.hprof
          cp tests/fixtures/dump_4_philosophers.hprof docs/samples/dump_4_philosophers.hprof
          cp tests/fixtures/dump_7_gauss-mix.hprof    docs/samples/dump_7_gauss-mix.hprof

      - name: Build OQL guide
        run: bash scripts/build-oql-guide.sh

      - name: Build find-leaks page and shared WASM assets
        run: bash scripts/build-find-leaks.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5

  # Package the linux-gnu binary from build-test alongside hprof-redact.
  # Reuses the build-test artifact to avoid a duplicate full Rust build.
  package-linux-gnu:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Download hprof-analyzer binary
        uses: actions/download-artifact@v8
        with:
          name: hprof-analyzer-linux
          path: target/x86_64-unknown-linux-gnu/release

      - name: Make binary executable
        run: chmod +x target/x86_64-unknown-linux-gnu/release/hprof-analyzer

      - name: Build hprof-redact
        run: cargo build --release -p hprof-redact --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          staging="hprof-analyzer-x86_64-unknown-linux-gnu"
          mkdir "$staging"
          cp target/x86_64-unknown-linux-gnu/release/hprof-analyzer "$staging/"
          cp target/x86_64-unknown-linux-gnu/release/hprof-redact   "$staging/"
          cp LICENSE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz

  # Build release binaries for all non-linux-gnu targets.
  build-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: build-release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --features native --target ${{ matrix.target }}
          cargo build --release -p hprof-redact --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          staging="hprof-analyzer-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/hprof-analyzer" "$staging/"
          cp "target/${{ matrix.target }}/release/hprof-redact" "$staging/"
          cp LICENSE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          staging="hprof-analyzer-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/hprof-analyzer.exe" "$staging/"
          cp "target/${{ matrix.target }}/release/hprof-redact.exe" "$staging/"
          cp LICENSE README.md "$staging/"
          7z a "$staging.zip" "$staging"
          echo "ASSET=$staging.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Tagged release: publish archives to the Release for the pushed tag.
  release-tag:
    needs: [build-release, package-linux-gnu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p hprof-analyzer --no-verify

  # Tagged release: open a PR on the Homebrew tap with updated URLs + SHA256s.
  update-homebrew-tap:
    needs: release-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        run: |
          mac_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          linux_x86=$(sha256sum artifacts/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          linux_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          echo "mac_arm=$mac_arm"       >> "$GITHUB_OUTPUT"
          echo "linux_x86=$linux_x86"  >> "$GITHUB_OUTPUT"
          echo "linux_arm=$linux_arm"  >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: parttimenerd/homebrew-hprof-analyzer
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write formula and open PR
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.linux_arm }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/parttimenerd/hprof-analyzer/releases/download/${TAG}"
          BRANCH="release-${TAG}"

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          python3 - "$BASE_URL" "$SHA_MAC_ARM" "$SHA_LINUX_X86" "$SHA_LINUX_ARM" "$VERSION" <<'PYEOF'
          import sys
          base_url, sha_mac, sha_x86, sha_arm, version = sys.argv[1:]
          formula = f'''class HprofAnalyzer < Formula
            desc "Fast, low-memory Java HPROF heap-dump analyzer with MCP server and OQL query engine"
            homepage "https://github.com/parttimenerd/hprof-analyzer"
            license "MIT"

            on_macos do
              on_arm do
                url "{base_url}/hprof-analyzer-aarch64-apple-darwin.tar.gz"
                sha256 "{sha_mac}"
                version "{version}"
              end
            end

            on_linux do
              on_intel do
                url "{base_url}/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "{sha_x86}"
                version "{version}"
              end
              on_arm do
                url "{base_url}/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "{sha_arm}"
                version "{version}"
              end
            end

            def install
              bin.install "hprof-analyzer"
            end

            def caveats
              <<~EOS
                Add the MCP server to Claude Code:
                  claude mcp add hprof -- hprof-analyzer mcp

                Or add to Claude Desktop (~/.claude/mcp.json):
                  {{ "mcpServers": {{ "hprof": {{ "command": "hprof-analyzer", "args": ["mcp"] }} }} }}

                See https://github.com/parttimenerd/hprof-analyzer#mcp-server--ai-integration
              EOS
            end

            test do
              system "#{{bin}}/hprof-analyzer", "--version"
              assert_match "SELECT", shell_output("#{{bin}}/hprof-analyzer heap docs --topic syntax")
            end
          end
          '''
          with open("Formula/hprof-analyzer.rb", "w") as f:
              f.write(formula)
          PYEOF

          git add Formula/hprof-analyzer.rb
          git commit -m "Update hprof-analyzer formula to ${TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --repo parttimenerd/homebrew-hprof-analyzer \
            --head "$BRANCH" \
            --base main \
            --title "Update hprof-analyzer to ${TAG}" \
            --body "Automated formula update for release ${TAG}."

  # Nightly push: also update the tap's nightly formula (separate file).
  update-homebrew-tap-nightly:
    needs: release-nightly
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        run: |
          mac_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          linux_x86=$(sha256sum artifacts/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          linux_arm=$(sha256sum artifacts/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          echo "mac_arm=$mac_arm"       >> "$GITHUB_OUTPUT"
          echo "linux_x86=$linux_x86"  >> "$GITHUB_OUTPUT"
          echo "linux_arm=$linux_arm"  >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: parttimenerd/homebrew-hprof-analyzer
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write nightly formula and push
        env:
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.linux_arm }}
          COMMIT: ${{ github.sha }}
        run: |
          BASE_URL="https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly"

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 - "$BASE_URL" "$SHA_MAC_ARM" "$SHA_LINUX_X86" "$SHA_LINUX_ARM" <<'PYEOF'
          import sys
          base_url, sha_mac, sha_x86, sha_arm = sys.argv[1:]
          nightly = f'''class HprofAnalyzerNightly < Formula
            desc "hprof-analyzer nightly — rolling build from main (MCP server + heap CLI)"
            homepage "https://github.com/parttimenerd/hprof-analyzer"
            license "MIT"
            version "nightly"

            on_macos do
              on_arm do
                url "{base_url}/hprof-analyzer-aarch64-apple-darwin.tar.gz"
                sha256 "{sha_mac}"
              end
            end

            on_linux do
              on_intel do
                url "{base_url}/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "{sha_x86}"
              end
              on_arm do
                url "{base_url}/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "{sha_arm}"
              end
            end

            def install
              bin.install "hprof-analyzer"
            end

            def caveats
              <<~EOS
                Add the MCP server to Claude Code:
                  claude mcp add hprof -- hprof-analyzer mcp

                See https://github.com/parttimenerd/hprof-analyzer#mcp-server--ai-integration
              EOS
            end

            test do
              system "#{{bin}}/hprof-analyzer", "--version"
              assert_match "SELECT", shell_output("#{{bin}}/hprof-analyzer heap docs --topic syntax")
            end
          end
          '''
          stable = nightly.replace(
              "class HprofAnalyzerNightly",
              "class HprofAnalyzer",
          ).replace(
              "hprof-analyzer nightly — rolling build from main (MCP server + heap CLI)",
              "Fast, low-memory Java HPROF heap-dump analyzer with MCP server and OQL query engine",
          )
          with open("Formula/hprof-analyzer-nightly.rb", "w") as f:
              f.write(nightly)
          # Only overwrite stable formula if it still points to nightly URLs
          # (once a tagged release is published, update-homebrew-tap takes over).
          with open("Formula/hprof-analyzer.rb") as f:
              current_stable = f.read()
          if "releases/download/nightly" in current_stable:
              with open("Formula/hprof-analyzer.rb", "w") as f:
                  f.write(stable)
          PYEOF

          git add Formula/hprof-analyzer-nightly.rb Formula/hprof-analyzer.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update nightly formula (${COMMIT::8})"
          git push origin main

  # Main push / manual: replace the single rolling `nightly` pre-release.
  release-nightly:
    needs: [build-release, package-linux-gnu]
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          echo "NIGHTLY_DATE=$(date -u '+%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Publish rolling nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ env.NIGHTLY_DATE }})"
          prerelease: true
          files: artifacts/*
          body: |
            Rolling nightly build — updated on every push to `main`.
            Commit: ${{ github.sha }}

            ## Install / Update

            **Already installed?** Just run:
            ```sh
            hprof-analyzer update nightly
            ```

            **First install** — pick your platform below, then use `hprof-analyzer update nightly` to stay current.

            **Linux x86_64 (glibc)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv hprof-analyzer-x86_64-unknown-linux-gnu/hprof-analyzer /usr/local/bin/
            ```

            **Linux x86_64 (static musl — minimal containers, older distros)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-unknown-linux-musl.tar.gz | tar xz
            sudo mv hprof-analyzer-x86_64-unknown-linux-musl/hprof-analyzer /usr/local/bin/
            ```

            **Linux aarch64 (glibc)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-aarch64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv hprof-analyzer-aarch64-unknown-linux-gnu/hprof-analyzer /usr/local/bin/
            ```

            **macOS (Apple Silicon)**
            ```sh
            curl -L https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv hprof-analyzer-aarch64-apple-darwin/hprof-analyzer /usr/local/bin/
            ```

            **Windows x86_64** — download [`hprof-analyzer-x86_64-pc-windows-msvc.zip`](https://github.com/parttimenerd/hprof-analyzer/releases/download/nightly/hprof-analyzer-x86_64-pc-windows-msvc.zip) and place `hprof-analyzer.exe` on your `PATH`.
