tag: ready
tagline: Fast heap dump analyser (Rust CLI). Reproduces Eclipse MAT's System Overview, Leak Suspects,
  Top Consumers, and Threads views with a fraction of the memory overhead. Handles dumps larger than
  10 GiB that MAT cannot open. Ships an OQL query engine, a disk-cached interactive analysis mode,
  an MCP server for AI-assisted triage, an HTTP server for the browser UI and LLM agent access, a redact subcommand to zero
  sensitive data before sharing, MAT cache generation, and an in-browser WASM UI for dumps up to 3 GiB.
tagline_short: Fast heap dump analyser — MAT-parity reports, OQL, MCP server, redaction, browser UI.
cargo_crate: hprof-analyzer
github_pages: https://parttimenerd.github.io/hprof-analyzer/
when_to_use:
- You need to analyse a heap dump without Eclipse MAT's memory overhead
- You have a very large heap dump (>10 GiB) that MAT cannot handle
- You want a quick in-browser analyser for smaller dumps (WASM, no install)
- You want Leak Suspects, Top Consumers, and thread views without a GUI IDE
- You need scriptable, CI-friendly heap analysis (JSON output, diff two dumps)
- You want AI-assisted heap triage via Claude, Cline, or other MCP clients
- You want to query a heap dump with OQL from the CLI or an interactive REPL
- You need to redact sensitive data from a dump before sharing it
- You want to speed up Eclipse MAT's first open of a large dump (cache generation)
when_not_to_use:
- You need full interactive MAT-style object graph exploration (use Eclipse MAT)
links:
