    if (_timer) clearInterval(_timer);
    var s = document.createElement("script");
    s.textContent = src;
    document.body.appendChild(s);
  }).catch(function (e) {
    var fb = document.getElementById("hprof-fallback");
    if (fb) fb.textContent = "Failed to load report bundle: " + e;
  });
})();
</script>
</body>
