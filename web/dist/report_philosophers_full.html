  var _dataLen = dataEl ? dataEl.textContent.length : 0;

  var _pbl = document.getElementById("hprof-pb-label");

    s.textContent = src;
    document.body.appendChild(s);
  }).catch(function (e) {

    if (fb) fb.textContent = "Failed to load report bundle: " + e;
  });
})();
</script>
